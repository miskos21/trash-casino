server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: raccoon-royale-backend
  config:
    # Local secrets such as LLM_API_KEY live in the gitignored root .env. OS environment variables still win.
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  # Milestone 1 has no repositories. Explicitly opt into PostgreSQL with its profile.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  web-origin: ${WEB_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
  # NEAR Testnet only. TRASH has no real-world value. Paid rooms and wallet login are
  # disabled unless the bridge URL, bridge token, and both contract IDs are set.
  chain:
    network: ${NEAR_NETWORK:testnet} # testnet, or sandbox for a local rehearsal
    bridge-url: ${NEAR_BRIDGE_URL:}
    bridge-token: ${BRIDGE_TOKEN:}
    token-id: ${TRASH_TOKEN_CONTRACT_ID:}
    casino-id: ${TRASH_CASINO_CONTRACT_ID:}
    explorer-url: ${NEAR_EXPLORER_URL:https://testnet.nearblocks.io}
    buy-in-trash: ${LIARS_DICE_BUY_IN_TRASH:10}
    auth-recipient: ${NEAR_AUTH_RECIPIENT:trashnino}
    funding-timeout-ms: ${PAID_FUNDING_TIMEOUT_MS:180000}
    agents:
      don: ${NEAR_AGENT_DON_ACCOUNT_ID:}
      foxy: ${NEAR_AGENT_FOXY_ACCOUNT_ID:}
  llm:
    # auto: live LLM when LLM_API_KEY is set, otherwise the TEMPORARY MOCK brain. Also: mock, live.
    mode: ${LLM_MODE:auto}
    base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
    model: ${LLM_MODEL:openai/gpt-oss-120b}
    api-key: ${LLM_API_KEY:}
    timeout-ms: ${LLM_TIMEOUT_MS:5000}
logging:
  level:
    root: INFO
    org.springframework: INFO
  structured:
    format:
      console: logstash
